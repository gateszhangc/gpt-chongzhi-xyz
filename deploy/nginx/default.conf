server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; return 200 "ok"; }
    location ~* ^/(login|signin|sign-in|signup|sign-up|account|checkout|admin|api)(/|$) { add_header X-Robots-Tag "noindex" always; return 404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|svg|png|ico|webmanifest)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri/ =404; }
}
